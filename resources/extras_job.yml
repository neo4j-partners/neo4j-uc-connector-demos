# Extra regression coverage job.
#
# Runs the run_extra_*.py scripts: broader connection smoke checks, federated
# regression patterns, and Delta-table materialization of all discovered Neo4j
# labels and relationships. Deploy with `databricks bundle deploy` and run
# with `databricks bundle run extras`.
resources:
  jobs:
    extras:
      name: "[${bundle.target}] neo4j-uc extras regression"
      max_concurrent_runs: 1

      tasks:
        - task_key: connection_smoke
          existing_cluster_id: ${var.cluster_id}
          spark_python_task:
            python_file: ../validation/scripts/run_extra_connection_smoke.py
            parameters: ${var.script_params}

        - task_key: federated_regression
          depends_on:
            - task_key: connection_smoke
          existing_cluster_id: ${var.cluster_id}
          spark_python_task:
            python_file: ../validation/scripts/run_extra_federated_regression.py
            parameters: ${var.script_params}

        - task_key: metadata_sync_tables
          depends_on:
            - task_key: connection_smoke
          existing_cluster_id: ${var.cluster_id}
          spark_python_task:
            python_file: ../validation/scripts/run_extra_metadata_sync_tables.py
            parameters: ${var.script_params}
